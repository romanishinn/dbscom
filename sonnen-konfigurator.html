<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sonnenschutz-Preisrechner D&amp;B</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root { --bg:#eef0f1; --panel:#fff; --ink:#1c2226; --muted:#5b666e; --line:#d6dadd; --accent:#2c6a86; --accent-soft:#e1edf2; --gelb:#f5c518; --gelb-ink:#1c1c1c;
  --f-display:"Archivo","Geologica","Helvetica Neue",Arial,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; color-scheme:light; }
* { box-sizing:border-box; } html,body { margin:0; } [hidden] { display:none !important; }
body { background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45; }
.app { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:14px; padding:16px; }
@media (max-width:860px) { .app { grid-template-columns:1fr; padding:10px; } .pic { display:none !important; } }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:18px; min-width:0; }
h1 { font-family:var(--f-display); font-size:20px; margin:0 0 2px; letter-spacing:-.01em; }
.sub { color:var(--muted); font-size:13px; margin:0 0 6px; }
.step { display:grid; grid-template-columns:34px 1fr; gap:12px; padding:14px 0; border-top:1px solid var(--line); align-items:start; }
.step:first-of-type { border-top:0; }
.step i { width:30px; height:30px; border-radius:50%; background:var(--gelb); color:var(--gelb-ink); font:700 14px var(--f-body); font-style:normal; display:grid; place-items:center; }
.step h2 { font-family:var(--f-display); font-size:15px; margin:4px 0 8px; }
.seg { display:flex; gap:8px; flex-wrap:wrap; }
.seg button { font:inherit; font-size:14px; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:999px; padding:8px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
.seg button[aria-pressed="true"] { border-color:var(--accent); background:var(--accent-soft); font-weight:600; }
/* Produktwahl mit Bild */
.prods { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.prods button { position:relative; font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:0; cursor:pointer; overflow:hidden; text-align:left; display:grid; grid-template-rows:auto 1fr; transition:border-color .2s, box-shadow .2s, transform .2s; }
.prods button:hover { border-color:#9fb0ba; transform:translateY(-2px); box-shadow:0 10px 22px -14px rgba(28,34,38,.45); }
.prods .im { display:grid; place-items:center; aspect-ratio:4/3; background:radial-gradient(120% 90% at 50% 20%, #fbfcfc 0%, #e6eaec 70%, #dde2e5 100%); }
.prods .im svg { width:86%; height:auto; display:block; }
.prods .tx { padding:9px 12px 11px; display:grid; gap:1px; }
.prods .tx b { font-family:var(--f-display); font-size:15px; letter-spacing:-.01em; }
.prods .tx small { color:var(--muted); font-size:12px; line-height:1.3; }
.prods button[aria-pressed="true"] { border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); }
.prods button[aria-pressed="true"]::after { content:"✓"; position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:50%; background:var(--gelb); color:var(--gelb-ink); font:700 13px/24px var(--f-body); text-align:center; }
@media (max-width:520px) { .prods { gap:6px; } .prods .tx { padding:7px 8px 9px; } .prods .tx b { font-size:13.5px; } .prods .tx small { display:none; } }
.seg button i.c { width:16px; height:16px; border-radius:50%; border:1px solid rgba(0,0,0,.15); display:inline-block; }
.types { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px; }
.type { border:1px solid var(--line); border-radius:8px; background:transparent; padding:8px 6px 6px; cursor:pointer; display:grid; gap:4px; justify-items:center; font:500 12px var(--f-body); color:var(--ink); text-align:center; }
.type[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); background:var(--accent-soft); }
.type svg { width:72px; height:56px; }
.fields { margin-bottom:10px; }
.dims { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.dim label { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); margin-bottom:4px; }
.dim label .num { display:inline-flex; align-items:center; gap:4px; font-family:var(--f-mono); color:var(--ink); }
.dim label input { width:62px; font:500 15px var(--f-mono); color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:4px 6px; text-align:right; }
.dim label input:focus-visible, .spec input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
input[type=range] { width:100%; accent-color:var(--accent); }
.dim small { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; }
.res { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:4px; }
@media (max-width:620px) { .res { grid-template-columns:1fr; } }
.tier { border:1px solid var(--line); border-radius:8px; padding:12px 14px; display:grid; gap:4px; background:var(--panel); align-content:start; }
.tier.rec { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
.tier .lvl { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); font-weight:700; }
.tier .name { font-weight:600; }
.tier .sys { color:var(--muted); font-size:12.5px; }
.tier .price { font-family:var(--f-display); font-size:24px; letter-spacing:-.02em; margin-top:4px; }
.tier .price small { font:400 12px var(--f-body); color:var(--muted); margin-left:4px; }
.tier button { margin-top:8px; font:600 13px var(--f-body); border:0; border-radius:999px; padding:9px 12px; cursor:pointer; background:var(--ink); color:#fff; }
.tier.rec button { background:var(--gelb); color:var(--gelb-ink); }
.disc { font-size:12px; color:var(--muted); margin:12px 0 0; line-height:1.4; }
.hint { background:#fbf0e2; color:#a3621b; border-radius:6px; padding:8px 10px; font-size:12.5px; margin-top:10px; }
/* Spezifikation */
.spec { margin-top:4px; }
.spec table { width:100%; border-collapse:collapse; font-size:13.5px; }
.spec th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; padding:6px 6px; border-bottom:1px solid var(--line); }
.spec td { padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
.spec td.n { font-family:var(--f-mono); white-space:nowrap; text-align:right; }
.spec td .d { color:var(--muted); font-size:12px; }
.spec input.q { width:52px; font:500 14px var(--f-mono); text-align:center; border:1px solid var(--line); border-radius:4px; padding:4px; background:var(--bg); }
.spec .act { white-space:nowrap; }
.spec .act button { font:500 12px var(--f-body); border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:999px; padding:4px 10px; cursor:pointer; margin-left:4px; }
.spec tfoot td { border:0; padding-top:12px; }
.spec tfoot b { font-family:var(--f-display); font-size:22px; letter-spacing:-.02em; }
.spec .empty { color:var(--muted); font-size:13px; }
.btn { font:600 15px var(--f-body); border:0; border-radius:999px; padding:12px 20px; cursor:pointer; background:var(--gelb); color:var(--gelb-ink); display:inline-flex; align-items:center; gap:8px; }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.pic { display:grid; align-content:start; gap:10px; position:sticky; top:16px; }
.view { background:linear-gradient(180deg,#f7f8f9,#e9ecee); border:1px solid var(--line); border-radius:6px; padding:16px; display:grid; place-items:center; min-height:300px; }
.view svg { max-width:100%; height:auto; }
.fact { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
.fact span { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); display:block; }
.fact b { font-family:var(--f-mono); font-weight:500; }
#steps .step:first-of-type { border-top:1px solid var(--line); }
.lensum { margin:10px 0 0; font-size:13.5px; color:var(--muted); } .lensum b { color:var(--ink); font-family:var(--f-mono); font-weight:500; }
.prods { grid-template-columns:repeat(3,minmax(0,1fr)); }
@media (max-width:620px) { .prods { grid-template-columns:repeat(2,minmax(0,1fr)); } .prods .tx small { display:block !important; } }
.dims { grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); }
.tier.off { opacity:.55; }
/* ===== Mobil: volle Breite, Nummer neben der Überschrift, Produkte als Liste ===== */
@media (max-width:560px) {
  .app { padding:0; gap:0; }
  .panel { border:0; border-radius:0; padding:18px 16px 22px; }
  h1 { font-size:22px; }
  .step { grid-template-columns:26px minmax(0,1fr); column-gap:10px; row-gap:12px; padding:18px 0; }
  .step > div { display:contents; }
  .step > div > * { grid-column:1 / -1; min-width:0; }
  .step > div > h2 { grid-column:2; margin:0; align-self:center; font-size:16px; }
  .step i { width:26px; height:26px; font-size:13px; }
  .prods { grid-template-columns:minmax(0,1fr) !important; gap:8px; }
  .prods button { grid-template-columns:96px minmax(0,1fr); grid-template-rows:none; align-items:stretch; border-radius:12px; }
  .prods button:hover { transform:none; box-shadow:none; }
  .prods .im { aspect-ratio:auto; min-height:76px; height:100%; }
  .prods .im svg { width:92%; }
  .prods .tx { padding:10px 40px 10px 14px; align-content:center; }
  .prods .tx b { font-size:15.5px !important; }
  .prods .tx small { display:block !important; font-size:12.5px; }
  .prods button[aria-pressed="true"]::after { top:50%; margin-top:-12px; right:12px; }
  .dims { grid-template-columns:minmax(0,1fr); gap:18px; }
  .dim label { gap:10px; }
  .dim label > span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .dim label input { width:72px; font-size:16px; }
  .seg { gap:8px; }
  .seg button { text-align:left; max-width:100%; padding:9px 14px; min-height:40px; }
  .res { grid-template-columns:minmax(0,1fr) !important; }
  .spec table, .spec thead, .spec tbody, .spec tfoot, .spec tr { display:block; }
  .spec thead { display:none; }
  .spec tbody tr { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:6px 10px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
  .spec tbody td { display:block; padding:0; border:0; }
  .spec tbody td:first-child { grid-column:1 / -1; }
  .spec tbody td:nth-child(3) { color:var(--muted); text-align:left; }
  .spec .act button { margin:6px 6px 0 0; padding:6px 12px; font-size:12.5px; }
  .spec tfoot { display:block; }
  .spec tfoot tr { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding-top:14px; }
  .spec tfoot td { display:block; padding:0; text-align:left !important; }
  .btn { width:100%; justify-content:center; }
}
/* ===== Bedienkomfort ===== */
.ux-pre { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; }
.ux-pre button { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:7px 12px; cursor:pointer; display:grid; gap:1px; text-align:left; line-height:1.2; }
.ux-pre button b { font-size:13.5px; }
.ux-pre button small { font-size:12px; color:var(--muted); font-family:var(--f-mono); }
.ux-pre button[aria-pressed="true"] { border-color:var(--accent); background:var(--accent-soft); }
.ux-unk { align-self:center; font-size:13.5px; color:var(--accent); text-decoration:underline; text-underline-offset:3px; margin-left:4px; }
.ux-adv { width:100%; display:flex; justify-content:space-between; align-items:center; gap:12px; font:inherit; color:var(--ink); background:var(--bg); border:1px dashed var(--line); border-radius:10px; padding:12px 14px; margin:6px 0; cursor:pointer; text-align:left; }
.ux-adv span { display:grid; gap:2px; min-width:0; }
.ux-adv b { font-size:14.5px; }
.ux-adv small { font-size:12.5px; color:var(--muted); }
.ux-adv i { font-style:normal; font-size:20px; line-height:1; color:var(--muted); }
.ux-hide { display:none !important; }
.ux-trust { margin:12px 0 0; font-size:13px; color:var(--ink); }

@media (max-width:560px) { .ux-pre button { flex:1 1 calc(50% - 4px); } .ux-unk { flex-basis:100%; margin:2px 0 0; } }

/* ===== Markenfarben Design & Building Solutions ===== */
:root { --bg:#efeeeb; --panel:#fff; --ink:#110f0d; --muted:#5f5850; --line:#dcd7d0; --accent:#796b53; --accent-soft:#eee8de; --gelb:#796b53; --gelb-ink:#fff;
  --f-display:"Outfit","Geologica","Helvetica Neue",Arial,sans-serif; --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif; }
.ux-trust b { color:var(--accent); }
.hint-sw { color:var(--gelb-ink) !important; }
</style>

</head>
<body>
<div class="app">
  <section class="panel">
    <h1 data-t="title"></h1>
    <p class="sub" data-t="subtitle"></p>
    <div class="step"><i>1</i><div><h2 data-t="s_product"></h2><div class="prods" id="seg-prod" role="group"></div></div></div>
    <div id="steps"></div>
    <div class="step"><i>€</i><div><h2 id="res-title"></h2><div class="res" id="res"></div><p class="disc" id="disc"></p></div></div>
    <div class="step"><i>≡</i><div><h2 data-t="s_spec"></h2>
      <div class="spec" id="spec"></div>
      <p class="disc" data-t="spec_hint"></p>
      <p style="margin:14px 0 0"><button type="button" class="btn" id="send" data-t="send"></button></p>
    </div></div>
  </section>
  <aside class="pic">
    <div class="view"><svg id="draw" viewBox="0 0 300 300" role="img" aria-label=""></svg></div>
    <div class="fact"><span data-t="f_dim"></span><b id="f-dim"></b></div>
    <div class="fact"><span data-t="f_sel"></span><b id="f-sel"></b></div>
  </aside>
</div>
<script>
/* ============ PREISMODELL (Richtpreise inkl. 20 % MwSt. und Lieferung in Wien, ohne Montage; Referenz Fenster 120 × 150 cm) ============ */
var REF = 1.8; /* m² */
var P = {
  roll: { ref: [120, 150], lim: { w: [60, 300], h: [60, 300] }, k: 0.5, tiers: [
      { id: 'aufsatz', lvl: 'Beim Fenstertausch', name: 'Aufsatzrollladen', sys: 'Kasten sitzt auf dem Fenster', base: 390 },
      { id: 'vorbau', lvl: 'Zum Nachrüsten', name: 'Vorbaurollladen SK45', sys: 'Kasten außen an der Fassade', base: 490 },
      { id: 'up', lvl: 'Unsichtbar', name: 'Unterputzrollladen', sys: 'Kasten verschwindet in der Wand', base: 590 } ] },
  zip: { ref: [120, 150], lim: { w: [80, 500], h: [100, 350] }, k: 0.55, tiers: [
      { id: 'zip', lvl: 'Fenster und Türen', name: 'ZIP-Screen', sys: 'Funkmotor · Stoff im Reißverschluss geführt', base: 890 } ] },
  raff: { ref: [120, 150], lim: { w: [55, 550], h: [60, 300] }, k: 0.55, tiers: [
      { id: 'e', lvl: 'Standard', name: 'RAFF-e', sys: 'bis 4 m breit · Motor', base: 790, maxW: 400 },
      { id: 'i', lvl: 'Komfort', name: 'RAFF-i', sys: 'bis 5,5 m breit · Motor · leiser Lauf', base: 990 },
      { id: 'is', lvl: 'Automatik', name: 'RAFF-i mit Sensoren', sys: 'fährt nach Sonne und Wind', base: 1290 } ] },
  laden: { ref: [120, 150], lim: { w: [50, 240], h: [80, 260] }, k: 0.55, tiers: [
      { id: 'persiane', lvl: 'Aluminium', name: 'Eko Persiane', sys: 'pulverbeschichtet · 10 Jahre Garantie auf die Farbe', base: 590 } ] },
  verto: { ref: [400, 250], lim: { w: [200, 700], h: [200, 350], vd: [200, 700], vzier: [40, 300] }, pergola: true, tiers: [
      { id: 'verto', lvl: 'Vertikale Profile', name: 'WIN VERTO', sys: 'Aluminium 35 × 60 mm · Abstand 55 mm · pulverbeschichtet', base: 0 } ] }
};
/* ===== WIN VERTO: Preismodell exakt nach Preisliste 07.2026 (Profil = Grundpreis(Höhe) + (N−5)×Aufpreis(Höhe)); N = Anzahl Profile je Lauf, Breite = 90·N−55 mm ===== */
var VERTO = {
  heights: [1950, 2350, 2950, 3150, 3350, 3950],
  base: { 1950: 317, 2350: 377, 2950: 466, 3150: 557, 3350: 591, 3950: 691 },
  per:  { 1950: 53,  2350: 64,  2950: 80,  3150: 96,  3350: 102, 3950: 120 },
  ledPer:  { none: 0, white: 60, rgb: 120, rgbw: 135 },  /* € je Profil, indikativ */
  ledCtrl: { none: 0, white: 250, rgb: 250, rgbw: 270 }, /* Steuerung einmalig */
  corner: 53, colour: { std: 0, nonstd: 0.15, excl: 0.40, holz: 1.00 }, colourMin: 70,
  /* Typologien: runs = Seiten (B = Breite, T = Tiefe, Z = Zierbreite), corners = Eckverbindungen */
  types: [
    { id: 'akzent', runs: ['Z'],                corners: 0 },
    { id: 'front',  runs: ['B'],                corners: 0 },
    { id: 'ecke',   runs: ['B', 'T'],           corners: 1 },
    { id: 'gegen',  runs: ['B', 'B'],           corners: 0 },
    { id: 'u',      runs: ['B', 'T', 'T'],      corners: 2 },
    { id: 'rund',   runs: ['B', 'T', 'B', 'T'], corners: 4 }
  ]
};
function vTier(mm) { for (var i = 0; i < VERTO.heights.length; i++) if (VERTO.heights[i] >= mm) return VERTO.heights[i]; return 3950; }
function vN(widthMm) { return Math.max(5, Math.round((widthMm + 55) / 90)); }
function vRuns() {
  var B = S.w * 10, T = S.vd * 10, Z = Math.min(S.vzier, S.w) * 10, map = { B: B, T: T, Z: Z };
  return (VERTO.types.filter(function (x) { return x.id === S.vtyp; })[0] || VERTO.types[0]).runs.map(function (r) { return map[r]; });
}
function vCorners() { return (VERTO.types.filter(function (x) { return x.id === S.vtyp; })[0] || VERTO.types[0]).corners; }
function vCalc() {
  var needMm = S.h * 10 - (S.vlevel === 'a' ? 220 : 0), tier = vTier(needMm);
  var runs = vRuns(), N = runs.map(vN), total = N.reduce(function (a, b) { return a + b; }, 0);
  var prof = N.reduce(function (a, n) { return a + VERTO.base[tier] + (n - 5) * VERTO.per[tier]; }, 0);
  var cpct = VERTO.colour[S.vcol] || 0, col = prof * cpct; if (cpct > 0) col = Math.max(col, VERTO.colourMin);
  var led = S.vled === 'none' ? 0 : VERTO.ledPer[S.vled] * total + VERTO.ledCtrl[S.vled];
  var corner = vCorners() * VERTO.corner;
  return { tier: tier, N: N, total: total, price: prof + col + led + corner };
}
var F = {
  drive: { gurt: 0, kurbel: 40, motor: 190, solar: 390 },     /* Rollladen, € */
  armor: { alu: 1, rc2: 1.25 },                                 /* Rollladen-Panzer */
  colour: { std: 1, ral: 1.1, holz: 1.15 },
  fabric: { soltis: 1, dark: 1.12, view: 1 },                   /* ZIP */
  zipDrive: { funk: 0, solar: 250 },
  slat: { c80: 1, z90: 1.08 },                                  /* Raffstore */
  box: { auf: 1, unter: 1.06 },
  open: { dreh: 1, schiebe: 1.3 },                              /* Läden */
  louv: { fest: 1, beweglich: 1.15 },
  sensor: 290, insect: 119
};

/* ============ TEXTE ============ */
var LANG = (new URLSearchParams(location.search).get('lang') || 'de').slice(0, 2);
var T = {
  de: { title: 'Was kostet Sonnenschutz?', subtitle: 'Fenstermaß eingeben, Ausstattung wählen, und Sie sehen sofort den Richtpreis.',
    s_product: 'Produkt', s_size: 'Fenstermaß', s_sit: 'Situation', s_drive: 'Bedienung', s_armor: 'Panzer', s_colour: 'Farbe', s_extra: 'Zusatz', s_fabric: 'Stoff', s_sensor: 'Automatik', s_slat: 'Lamelle', s_box: 'Kasten', s_open: 'Art', s_louv: 'Lamellen', s_spec: 'Ihre Spezifikation',
    p_roll: 'Rollladen', p_zip: 'ZIP-Screen', p_raff: 'Raffstore', p_laden: 'Fensterläden',
    pd_roll: 'Dunkel, ruhig, sicher', pd_zip: 'Sonne weg, Blick bleibt', pd_raff: 'Licht stufenlos lenken', pd_laden: 'Klassisch, aus Alu',
    width: 'Breite', height: 'Höhe',
    sit_new: 'Mit neuen Fenstern', sit_old: 'An bestehenden Fenstern', sit_bau: 'Neubau oder Fassade neu',
    d_gurt: 'Gurt', d_kurbel: 'Kurbel', d_motor: 'Funkmotor', d_solar: 'Solarmotor', zd_funk: 'Funkmotor', zd_solar: 'Solarmotor (ohne Kabel)',
    a_alu: 'Aluminium, ausgeschäumt', a_rc2: 'Einbruchhemmend RC2',
    c_std: 'Weiß, Grau oder Anthrazit', c_ral: 'Wunsch-RAL', c_holz: 'Holzoptik',
    x_none: 'Ohne', x_insect: 'Mit Insektenschutz',
